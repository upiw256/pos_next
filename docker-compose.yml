version: '3.8'

networks:
  pos_network:
    driver: bridge

services:
  pos_db:
    image: mongo:6.0
    container_name: pos_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pos_network

  pos_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_web_app
    restart: always
    ports:
      - "9090:9090"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://pos_db:27017/pos
      - NEXTAUTH_URL=http://localhost:9090
      - NEXTAUTH_SECRET=p0s_syst3m_s3cr3t_v3ry_str0ng_123
    depends_on:
      - pos_db
    networks:
      - pos_network

volumes:
  mongodb_data:

